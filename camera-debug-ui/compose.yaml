# camera-debug-ui: NiceGUI page for inspecting a camera's frames and
# creating/editing the HudWidget overlays baked into them. Talks to
# camera-ingress (or any other SpiriCamera) over SpiriSynq -- it does
# not capture from hardware itself, so it has nothing to point at a
# source string for.
services:
  camera-debug-ui:
    image: ghcr.io/spiri-robotics/spiricamera:latest
    restart: unless-stopped
    command: ["python", "-m", "SpiriCamera.ui"]
    # Joins the spirisynq network rather than relying on LAN multicast
    # (which a docker bridge doesn't pass); zenoh-router bridges this
    # into the rest of SpiriSynq. See the zenoh-router app.
    networks:
      - spirisynq
    ports:
      - "8080:8080"

networks:
  spirisynq:
    external: true
