# camera-ingress: captures from the SiYi camera and publishes it onto
# SpiriSynq, as cameras/<CAMERA_NAME>/raw, hud and preview (hud and preview
# relay raw in-process), and serves each of them over RTSP.
#
# The SiYi camera's video crosses the radio link, so it is pulled exactly
# once, here. Everything else reads from this app, never the camera itself:
#
#   QGC:        rtsp://<this host>:8554/raw  (or /hud, /preview), UDP only;
#               its RTCP drives the camera's rate control.
#   cloud-link: rtsp://127.0.0.1:8554/<stream>/relay, TCP, from its MediaMTX
#               on this host, which serves Spiri Cloud's Frigate as WHEP.
#
# Each stream is encoded to H.264 once, in this process, however many
# viewers, and only while one is watching.
x-spiri-settings:
  - env: CAMERA_SOURCE
    label: Camera stream
    help: >-
      The camera's own RTSP stream, pulled once, over UDP. The SiYi camera's
      is rtsp://192.168.144.25:8554/video1.
    default: rtsp://192.168.144.25:8554/video1
  - env: RESOLUTION
    widget: select
    label: Resolution
    help: >-
      The most lines raw, hud and the RTSP streams have: 1080 for 1080p, down
      to 360 for 360p. Fewer cost less CPU and bandwidth.
    options: ["1080", "720", "480", "360"]
    default: "1080"
  - env: LENS_HFOV
    widget: number
    label: Horizontal field of view (°)
    help: >-
      The camera's lens, so maps can draw what it sees; the vertical follows
      from the picture's shape. The SiYi ZT30's zoom camera is 58.1° without
      zoom (SiYi's spec), and neither it nor the autopilot reports the zoomed
      one, so this is wrong when zoomed in. 0 for unknown.
    default: "58.1"
    min: 0
    max: 179
  - env: H264_PRESET
    widget: select
    label: Video encoder speed
    help: >-
      x264's preset for each stream's one H.264 encode. Faster costs less CPU
      for a slightly worse picture at the same bitrate: at 720p30 on this Pi,
      veryfast takes about one core, ultrafast half, medium over two.
    options: ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium"]
    default: veryfast

services:
  camera-ingress:
    # SpiriCamera 0.4.0, pinned.
    image: ghcr.io/spiri-robotics/spiricamera:0.4.1@sha256:98fb007f4dfe14cfaae3dd5930524d7e5de410717be0ae7d14c201fd34a4eda6
    restart: unless-stopped
    command: ["SpiriCamera", "run"]
    # Joins the spirisynq network rather than relying on LAN multicast
    # (which a docker bridge doesn't pass); zenoh-router bridges this
    # into the rest of SpiriSynq. See the zenoh-router app.
    networks:
      - spirisynq
    ports:
      - "8554:8554/tcp"
      - "8000-8003:8000-8003/udp"
    environment:
      - SPIRICAMERA_SOURCE=${CAMERA_SOURCE:-rtsp://192.168.144.25:8554/video1}
      # The SiYi camera has no RTSP over TCP.
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;udp
      # Published as cameras/1/raw, hud and preview.
      - SPIRICAMERA_CAMERA_NAME=1
      - SPIRICAMERA_QUALITY=${QUALITY:-80}
      # Wide enough that the height alone bounds the picture.
      - SPIRICAMERA_FRAME_WIDTH=3840
      - SPIRICAMERA_FRAME_HEIGHT=${RESOLUTION:-1080}
      - SPIRICAMERA_FRAMERATE=${FRAMERATE:-30}
      - SPIRICAMERA_H264_PRESET=${H264_PRESET:-veryfast}
      # The lens at 1x zoom; the vertical follows from the frame's aspect.
      - SPIRICAMERA_HFOV=${LENS_HFOV:-58.1}
      # Mounted on spirimav's gimbal, so the camera has a pose and looks where it does.
      # ./ is this robot's own topic.
      - SPIRICAMERA_RELATIVE_TO=${RELATIVE_TO:-./robot_gimbal1}
      # spirimav's HUD widgets, drawn on cameras/1/hud.
      - SPIRICAMERA_HUD_WIDGETS=${HUD_WIDGETS:-./hud/widgets/horizon ./hud/widgets/heading ./hud/widgets/gimbal1 ./hud/widgets/battery ./hud/widgets/flight ./hud/widgets/status ./robot_home_hud ./robot_roi_hud}
    volumes:
      # The host's name is the camera's base topic, not the container's.
      - /etc/hostname:/etc/spirisynq_base_topic:ro

networks:
  spirisynq:
    external: true
